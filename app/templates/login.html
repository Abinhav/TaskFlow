
{% extends "base.html" %}

{% block title %}
Login | TaskFlow
{% endblock %}

{% block content %}

<style>
.auth-page {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 55px 20px;
    background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #eef2ff);
}

.auth-card {
    width: 100%;
    max-width: 440px;
    padding: 42px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
}

.auth-icon {
    width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    background: #eff6ff;
    color: #2563eb;
    border-radius: 15px;
    font-size: 25px;
}

.auth-card h1 {
    color: #0f172a;
    font-size: 29px;
    margin-bottom: 8px;
    letter-spacing: -0.7px;
}

.auth-subtitle {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 28px;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.auth-form label {
    color: #334155;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
}

.auth-form input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    color: #1e293b;
    background: #ffffff;
    transition: 0.2s;
}

.auth-form input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.auth-form input::placeholder {
    color: #94a3b8;
}

.auth-submit {
    width: 100%;
    height: 49px;
    margin-top: 20px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.auth-submit:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(37, 99, 235, 0.2);
}

.auth-switch {
    margin-top: 25px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
}

.auth-switch a {
    color: #2563eb;
    font-weight: 700;
    text-decoration: none;
}

.auth-switch a:hover {
    text-decoration: underline;
}

.auth-error {
    padding: 11px 13px;
    margin-bottom: 16px;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    font-size: 13px;
}

@media (max-width: 480px) {
    .auth-card {
        padding: 28px 22px;
    }

    .auth-card h1 {
        font-size: 25px;
    }
}
</style>

<section class="auth-page">
    <div class="auth-card">

        <div class="auth-icon">✓</div>

        <h1>Welcome Back!</h1>
        <p class="auth-subtitle">
            Login to your TaskFlow account and stay organized.
        </p>

        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}

        <form class="auth-form" method="POST" action="{{ url_for('login') }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="auth-submit">
                Login to Account
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

    </div>
</section>

{% endblock %}
