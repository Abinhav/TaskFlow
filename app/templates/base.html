
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskFlow{% endblock %}</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/taskflow-logo.png') }}"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
        }

        .navbar-brand img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 10px;
        }

        .navbar-brand h2 {
            margin: 0;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.8px;
            color: #0f172a;
        }

        .navbar-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar-links a {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }

        .navbar-links a:hover {
            color: #2563eb;
        }

        .navbar-profile-link {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8 !important;
        }

        .navbar-profile-link:hover {
            background: #dbeafe;
        }

        .navbar-logout-form {
            margin: 0;
            padding: 0;
        }

        .navbar-logout-btn {
            padding: 9px 16px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fff1f2;
            color: #be123c;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .navbar-logout-btn:hover {
            background: #ffe4e6;
            border-color: #fda4af;
        }

        @media (max-width: 768px) {
            .navbar-brand img {
                width: 38px;
                height: 38px;
            }

            .navbar-brand h2 {
                font-size: 22px;
            }

            .navbar-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 14px;
            }
        }
    </style>

    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>

<body>

    <nav>

        <a href="{{ url_for('home') }}" class="navbar-brand">

            <img
                src="{{ url_for('static', filename='images/taskflow-logo.png') }}"
                alt="TaskFlow Logo"
            >

            <h2>TaskFlow.</h2>

        </a>

        <div class="navbar-links">

            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('dashboard') }}">Dashboard</a>

                <a
                    href="{{ url_for('profile') }}"
                    class="navbar-profile-link"
                >
                    <span>👤</span>
                    <span>Profile</span>
                </a>

                <form
                    method="POST"
                    action="{{ url_for('logout') }}"
                    class="navbar-logout-form"
                >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <button type="submit" class="navbar-logout-btn">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}">Register</a>

            {% endif %}

            <a href="{{ url_for('contact') }}">Contact</a>

        </div>

    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© <span id="current-year">2026</span> TaskFlow. All rights reserved.</p>
    </footer>

</body>
</html>
