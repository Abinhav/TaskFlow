
{% extends "base.html" %}

{% block title %}
500 | Internal Server Error - TaskFlow
{% endblock %}

{% block content %}

<style>
    .error-section {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        text-align: center;
        background: #f8fafc;
    }

    .error-container {
        max-width: 550px;
        width: 100%;
    }

    .error-code {
        font-size: 110px;
        font-weight: 800;
        color: #ef4444;
        line-height: 1;
        margin-bottom: 20px;
    }

    .error-container h1 {
        font-size: 30px;
        color: #0f172a;
        margin-bottom: 15px;
    }

    .error-container p {
        font-size: 16px;
        color: #64748b;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .error-home-btn {
        display: inline-block;
        padding: 13px 25px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 9px;
        font-weight: 600;
        transition: background 0.2s;
    }

    .error-home-btn:hover {
        background: #1d4ed8;
    }

    @media (max-width: 600px) {
        .error-code {
            font-size: 80px;
        }

        .error-container h1 {
            font-size: 24px;
        }
    }
</style>

<section class="error-section">

    <div class="error-container">

        <div class="error-code">500</div>

        <h1>Internal Server Error</h1>

        <p>
            Something went wrong on our server.
            Our team has been notified. Please try again later.
        </p>

        <a href="{{ url_for('home') }}" class="error-home-btn">
            Back to Home
        </a>

    </div>

</section>

{% endblock %}
