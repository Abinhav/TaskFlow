
{% extends "base.html" %}

{% block title %}
Edit Profile | TaskFlow
{% endblock %}

{% block content %}

<style>
    .edit-profile-section {
        min-height: 75vh;
        padding: 50px 20px;
        background: #f8fafc;
    }

    .edit-profile-container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .edit-profile-container h1 {
        color: #1e293b;
        margin-bottom: 8px;
    }

    .edit-profile-container p {
        color: #64748b;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #2563eb;
    }

    .error-message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    .btn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
    }

    .save-btn {
        background: #2563eb;
        color: white;
    }

    .cancel-btn {
        background: #f1f5f9;
        color: #475569;
    }

    @media (max-width: 600px) {
        .edit-profile-container {
            padding: 25px 20px;
        }
    }
</style>

<section class="edit-profile-section">
    <div class="edit-profile-container">

        <h1>Edit Profile</h1>
        <p>Update your account information.</p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_profile') }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ user.username }}"
                    maxlength="80"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    maxlength="120"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn save-btn">
                    Save Changes
                </button>

                <a href="{{ url_for('profile') }}" class="btn cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</section>

{% endblock %}
