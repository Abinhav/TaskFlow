
{% extends "base.html" %}

{% block title %}
Change Password | TaskFlow
{% endblock %}

{% block content %}

<style>
    .password-section {
        min-height: 75vh;
        padding: 50px 20px;
        background: #f8fafc;
    }

    .password-container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .password-container h1 {
        color: #1e293b;
        margin-bottom: 8px;
    }

    .password-container p {
        color: #64748b;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #2563eb;
    }

    .error-message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    .btn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
    }

    .save-btn {
        background: #2563eb;
        color: white;
    }

    .cancel-btn {
        background: #f1f5f9;
        color: #475569;
    }

    @media (max-width: 600px) {
        .password-container {
            padding: 25px 20px;
        }
    }
</style>

<section class="password-section">
    <div class="password-container">

        <h1>Change Password</h1>
        <p>Choose a strong password to keep your account secure.</p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('change_password') }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn save-btn">
                    Update Password
                </button>

                <a href="{{ url_for('profile') }}" class="btn cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</section>

{% endblock %}
